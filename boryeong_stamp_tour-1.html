<html lang="ko">
<head>
<meta charset="UTF-8">

<title>가을 보령생태로드 · 모바일 스탬프 투어</title>

<meta property="og:description" content="소황사구·무창포 닭벼슬섬·군헌어촌체험마을, 3곳을 걸으며 스탬프를 모으는 보령시 가을 생태관광 이벤트. 완주하면 보령사랑상품권 등 경품 응모!">

<style>
  :root{
    --tide-teal:#0F5257;      /* 주 브랜드 컬러 - 갯벌/바다 */
    --tide-teal-dark:#0A3A3E;
    --sunset:#E8734A;         /* 포인트 - 무창포 낙조 */
    --sunset-light:#F4A67E;
    --sand:#F4EEE1;           /* 배경 - 해안사구 모래 */
    --sand-deep:#E9DFC8;
    --ink:#152225;            /* 텍스트 */
    --ink-soft:#4B5B5C;
    --mint:#B7DFD3;           /* 완료 상태 */
    --line:#DCD3BE;
    --white:#FFFFFF;
    --radius-lg:20px;
    --radius-md:14px;
    --shadow:0 8px 24px rgba(15,82,87,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background:var(--sand);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--sand);position:relative;padding-bottom:48px;}

  /* ---------- HERO ---------- */
  .hero{
    background:linear-gradient(165deg,var(--tide-teal) 0%,var(--tide-teal-dark) 62%,#08292c 100%);
    color:var(--white);
    padding:20px 20px 30px;
    border-radius:0 0 28px 28px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; right:-40px; bottom:-60px; width:200px; height:200px;
    background:radial-gradient(circle,var(--sunset) 0%,transparent 70%);
    opacity:.35;
  }
  .top-row{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;}
  .brand{font-size:12px;letter-spacing:.08em;color:var(--mint);font-weight:600;}
  .test-toggle{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.75);}
  .switch{width:34px;height:19px;border-radius:20px;background:rgba(255,255,255,.25);position:relative;cursor:pointer;transition:.2s;flex-shrink:0;}
  .switch.on{background:var(--sunset);}
  .switch .knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s;}
  .switch.on .knob{left:17px;}

  .hero h1{
    font-size:28px;margin:18px 0 4px;font-weight:800;letter-spacing:-.02em;line-height:1.25;position:relative;z-index:1;
  }
  .hero h1 em{font-style:normal;color:var(--sunset-light);}
  .hero p.sub{margin:0 0 16px;font-size:13.5px;color:rgba(255,255,255,.8);line-height:1.6;position:relative;z-index:1;}
  .badge-row{display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1;}
  .badge{
    font-size:11.5px;padding:6px 10px;border-radius:20px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);color:#fff;
  }

  /* ---------- PASSPORT PROGRESS ---------- */
  .passport{
    margin:-20px 16px 0;background:var(--white);border-radius:var(--radius-lg);
    box-shadow:var(--shadow);padding:18px 16px 16px;position:relative;z-index:2;
  }
  .passport-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .passport-title h2{font-size:14px;margin:0;color:var(--tide-teal-dark);font-weight:700;}
  .passport-count{font-size:13px;font-weight:800;color:var(--sunset);}
  .trail{display:flex;align-items:center;justify-content:space-between;position:relative;}
  .trail-line{position:absolute;top:20px;left:36px;right:36px;height:3px;background:var(--line);border-radius:2px;z-index:0;}
  .trail-line-fill{position:absolute;top:20px;left:36px;height:3px;background:var(--sunset);border-radius:2px;z-index:1;transition:width .3s;}
  .stop{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;z-index:2;cursor:pointer;}
  .stop-dot{
    width:40px;height:40px;border-radius:50%;background:var(--white);border:2.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:17px;transition:.25s;
  }
  .stop.done .stop-dot{border-color:var(--sunset);background:var(--sunset);color:#fff;}
  .stop-label{font-size:10.5px;margin-top:6px;color:var(--ink-soft);text-align:center;font-weight:600;max-width:70px;line-height:1.3;}
  .stop.done .stop-label{color:var(--tide-teal-dark);}

  /* ---------- SECTION ---------- */
  .section{padding:26px 20px 0;}
  .section-head{margin-bottom:12px;}
  .section-head .eyebrow{font-size:11px;letter-spacing:.08em;color:var(--sunset);font-weight:700;text-transform:uppercase;}
  .section-head h3{font-size:18px;margin:4px 0 0;font-weight:800;color:var(--tide-teal-dark);}
  .section-head p{font-size:13px;color:var(--ink-soft);margin:6px 0 0;line-height:1.6;}

  /* ---------- STATION CARD ---------- */
  .station{
    background:var(--white);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px;
    box-shadow:var(--shadow);border:1px solid rgba(15,82,87,.06);
  }
  .station-top{display:flex;gap:12px;align-items:flex-start;}
  .station-num{
    width:30px;height:30px;border-radius:9px;background:var(--sand-deep);color:var(--tide-teal-dark);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;
  }
  .station.done .station-num{background:var(--tide-teal);color:#fff;}
  .station-info{flex:1;min-width:0;}
  .station-info h4{margin:0;font-size:15.5px;font-weight:800;color:var(--ink);}
  .station-info .tag{font-size:11.5px;color:var(--sunset);font-weight:700;margin-top:2px;}
  .station-info p{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:8px 0 0;}
  .status-pill{
    font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:20px;flex-shrink:0;
    background:var(--sand-deep);color:var(--ink-soft);white-space:nowrap;
  }
  .station.done .status-pill{background:var(--mint);color:var(--tide-teal-dark);}

  .gps-btn{
    width:100%;margin-top:12px;padding:12px;border:none;border-radius:12px;
    background:var(--tide-teal);color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s;
  }
  .gps-btn:active{transform:scale(.98);}
  .gps-btn.done{background:var(--mint);color:var(--tide-teal-dark);}
  .gps-btn:disabled{opacity:.55;}
  .gps-feedback{font-size:11.5px;color:var(--ink-soft);margin-top:8px;text-align:center;line-height:1.5;}
  .gps-feedback.warn{color:var(--sunset);font-weight:600;}
  .test-btn{
    width:100%;margin-top:8px;padding:9px;border:1px dashed var(--sunset);border-radius:10px;
    background:#FFF6F0;color:var(--sunset);font-size:11.5px;font-weight:700;cursor:pointer;
  }

  /* ---------- REWARD ---------- */
  .reward-tiers{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
  .tier{
    background:var(--white);border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow);
    display:flex;gap:12px;align-items:center;border:1px solid rgba(15,82,87,.06);
  }
  .tier .ico{
    width:42px;height:42px;border-radius:12px;background:var(--sand-deep);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:19px;
  }
  .tier h5{margin:0;font-size:13.5px;font-weight:800;color:var(--ink);}
  .tier p{margin:3px 0 0;font-size:11.5px;color:var(--ink-soft);line-height:1.5;}

  .entry-card{
    background:var(--tide-teal-dark);border-radius:var(--radius-lg);padding:20px;margin-top:16px;color:#fff;
  }
  .entry-card.locked{background:var(--sand-deep);color:var(--ink-soft);}
  .entry-card h4{margin:0 0 4px;font-size:15px;font-weight:800;}
  .entry-card p.desc{font-size:12px;margin:0 0 16px;line-height:1.6;opacity:.85;}
  .entry-card.locked p.desc{opacity:1;}
  .field{margin-bottom:10px;}
  .field label{font-size:11.5px;font-weight:700;display:block;margin-bottom:5px;opacity:.9;}
  .field input{
    width:100%;padding:11px 12px;border-radius:10px;border:none;font-size:14px;
    background:rgba(255,255,255,.12);color:#fff;outline:none;
  }
  .field input::placeholder{color:rgba(255,255,255,.5);}
  .entry-card.locked .field input{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .consent{display:flex;gap:8px;align-items:flex-start;font-size:11px;line-height:1.5;margin:12px 0;opacity:.85;}
  .consent input{margin-top:2px;}
  .submit-btn{
    width:100%;padding:13px;border:none;border-radius:12px;background:var(--sunset);color:#fff;
    font-size:14px;font-weight:800;cursor:pointer;
  }
  .submit-btn:disabled{background:rgba(255,255,255,.15);color:rgba(255,255,255,.4);cursor:not-allowed;}
  .lock-msg{font-size:12.5px;text-align:center;padding:10px;font-weight:600;}

  .success-box{
    background:var(--mint);border-radius:var(--radius-md);padding:16px;text-align:center;margin-top:16px;
  }
  .success-box .no{font-size:20px;font-weight:900;color:var(--tide-teal-dark);letter-spacing:.03em;margin:6px 0;}
  .success-box p{margin:0;font-size:11.5px;color:var(--tide-teal-dark);line-height:1.6;}

  .footer-note{
    margin:28px 20px 0;padding:16px;border-radius:var(--radius-md);background:var(--sand-deep);
    font-size:11px;color:var(--ink-soft);line-height:1.7;
  }
  .footer-note b{color:var(--tide-teal-dark);}
  .footer-note .warn-line{color:var(--sunset);font-weight:700;}

  ::selection{background:var(--sunset-light);}
</style>
</head>

<script>
/* =====================================================================
   QR 코드 생성 라이브러리 (qrcode-generator, MIT License, Kazuhiko Arase)

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

const STORAGE_KEY = "boryeong-stamp-progress-v1";
let memoryFallback = {};

/* Claude 아티팩트(window.storage) → 일반 브라우저(localStorage) → 메모리
   순서로 자동 폴백. GitHub Pages 등 외부 호스팅에서도 그대로 동작합니다. */
async function storageGet(key){
  if(typeof window !== "undefined" && window.storage && typeof window.storage.get === "function"){
    try{
      const res = await window.storage.get(key, false);
      if(res && typeof res.value !== "undefined") return res.value;
    }catch(e){ /* 값 없음 또는 미지원 - 다음 방식 시도 */ }
  }
  try{
    const v = localStorage.getItem(key);
    if(v !== null) return v;
  }catch(e){ /* localStorage 미지원(프라이빗 모드 등) */ }
  return memoryFallback[key] || null;
}

async function storageSet(key, value){
  let saved = false;
  if(typeof window !== "undefined" && window.storage && typeof window.storage.set === "function"){
    try{ await window.storage.set(key, value, false); saved = true; }catch(e){ /* 다음 방식 시도 */ }
  }
  if(!saved){
    try{ localStorage.setItem(key, value); saved = true; }catch(e){ /* 다음 방식 시도 */ }
  }
  if(!saved){ memoryFallback[key] = value; }
}

async function loadState(){
  try{
    const raw = await storageGet(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      state.visited = saved.visited || {};
      state.entry = saved.entry || null;
    }
  }catch(e){ /* 저장된 값 없음 - 최초 방문 */ }
  state.loaded = true;
  render();
}

async function persist(){
  try{
    await storageSet(STORAGE_KEY, JSON.stringify({visited:state.visited, entry:state.entry}));
  }catch(e){ console.error("저장 실패", e); }
}

/* =====================================================================
   위치 인증 로직
   ===================================================================== */
function haversineM(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function checkIn(stationId){
  const station = CONFIG.stations.find(s => s.id === stationId);
  if(!station || state.visited[stationId]) return;

  if(!navigator.geolocation){
    state.gpsStatus[stationId] = {message:"이 브라우저에서는 위치 확인을 지원하지 않아요.", warn:true};
    render(); return;
  }

  state.gpsStatus[stationId] = {loading:true, message:"현재 위치를 확인하는 중..."};
  render();

  navigator.geolocation.getCurrentPosition(
    pos => {
      const dist = Math.round(haversineM(pos.coords.latitude, pos.coords.longitude, station.lat, station.lng));
      if(dist <= station.radiusM){
        state.visited[stationId] = new Date().toISOString();
        state.gpsStatus[stationId] = {message:`인증 완료! (거리 약 ${dist}m)`};
        persist();
      }else{
        state.gpsStatus[stationId] = {message:`현재 위치에서 약 ${dist.toLocaleString()}m 떨어져 있어요. 반경 ${station.radiusM}m 이내에서 다시 시도해 주세요.`, warn:true};
      }
      render();
    },
    err => {
      let msg = "위치 확인에 실패했어요. 위치 권한을 확인해 주세요.";
      if(err.code === 1) msg = "위치 권한이 거부되었어요. 브라우저 설정에서 위치 권한을 허용해 주세요.";
      if(err.code === 3) msg = "위치 확인이 지연되고 있어요. 다시 시도해 주세요.";
      state.gpsStatus[stationId] = {message:msg, warn:true};
      render();
    },
    { enableHighAccuracy:true, timeout:12000, maximumAge:0 }
  );
}

// Apps Script 웹앱으로 자동 제출. 성공/실패 여부를 state.autoSubmit에 기록해 화면에 반영합니다.
function trySubmitToWebApp(entry){
  const url = (CONFIG.webAppUrl || "").trim();
  if(!url){
    state.autoSubmit = "not-configured";
    render();
    return;
  }
  state.autoSubmit = "sending";
  render();

  fetch(url, {
    method: "POST",
    mode: "no-cors", // Apps Script 웹앱은 CORS 응답을 안 주는 경우가 많아 no-cors로 전송(응답은 못 읽지만 전송은 됨)
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // application/json으로 하면 preflight에서 막히는 경우가 있어 text/plain 사용
    body: JSON.stringify({
      entryNo: entry.entryNo,
      name: entry.name,
      phone: entry.phone,
      submittedAt: new Date(entry.submittedAt).toLocaleString('ko-KR'),
      visitedStations: getVisitedNamesList()
    })
  }).then(() => {
    state.autoSubmit = "sent"; // no-cors라 실제 성공여부까진 못 읽지만, 네트워크 에러가 없으면 대체로 정상 처리됨

  }).catch(() => {
    state.autoSubmit = "failed";
    render();
  });
}

          <label style="color:var(--ink-soft);">배포 URL</label>
          <input type="text" id="qrUrlInput" placeholder="https://example.com/boryeong-stamp-tour"
            style="width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;background:var(--sand);color:var(--ink);">
        </div>
        <button class="gps-btn" onclick="generateQr()">QR 코드 생성</button>
        <div id="qrResult" style="margin-top:14px;text-align:center;"></div>
      </div>
    </div>
  `;
}

function generateQr(){
  const input = document.getElementById("qrUrlInput");
  const url = (input.value || "").trim();
  const resultEl = document.getElementById("qrResult");
  if(!url){ resultEl.innerHTML = `<div class="gps-feedback warn">URL을 입력해 주세요.</div>`; return; }

  try{
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    const svg = qr.createSvgTag({cellSize:6, margin:2});
    const dataUrl = qr.createDataURL(6, 2);
    resultEl.innerHTML = `
      <div style="display:inline-block;background:#fff;padding:12px;border-radius:12px;">${svg}</div>
      <div style="margin-top:10px;">
        <a href="${dataUrl}" download="boryeong-stamp-tour-qr.png" class="submit-btn" style="display:inline-block;text-decoration:none;padding:10px 18px;">PNG 다운로드</a>
      </div>
      <div class="gps-feedback" style="margin-top:8px;">연결 주소: ${esc(url)}</div>
    `;
  }catch(e){
    resultEl.innerHTML = `<div class="gps-feedback warn">QR 생성 중 오류가 발생했어요: ${esc(e.message)}</div>`;
  }
}

function renderStation(s, idx){
  const done = !!state.visited[s.id];
  const status = state.gpsStatus[s.id] || {};
  return `
    <div class="station ${done?'done':''}" id="card-${s.id}">
      <div class="station-top">
        <div class="station-num">${String(idx+1).padStart(2,'0')}</div>
        <div class="station-info">
          <h4>${s.name}</h4>
          <div class="tag">${s.tag}</div>
          <p>${s.desc}</p>
        </div>
        <div class="status-pill">${done ? '인증완료':'미방문'}</div>
      </div>
      <button class="gps-btn ${done?'done':''}" ${done?'disabled':''} onclick="checkIn('${s.id}')">
        ${done ? '✓ 인증 완료' : (status.loading ? '위치 확인 중...' : '📍 현재 위치로 인증하기')}
      </button>
      ${state.testMode && !done ? `<button class="test-btn" onclick="testCheckIn('${s.id}')">🧪 GPS 없이 테스트 인증 (담당자용)</button>` : ''}
      ${status.message ? `<div class="gps-feedback ${status.warn?'warn':''}">${status.message}</div>` : ''}
    </div>
  `;
}

function renderEntryCard(allDone){
  if(state.entry){
    let statusMsg = "";
    let showManualMailBtn = false;

    if(state.autoSubmit === "sending"){
      statusMsg = "접수 처리 중이에요...";
    } else if(state.autoSubmit === "sent"){
      statusMsg = "담당자에게 자동으로 접수되었어요. 추첨 결과는 개별 안내드릴 예정입니다.";
    } else if(state.autoSubmit === "failed"){
      statusMsg = "⚠ 자동 접수 중 오류가 발생했어요. 아래 버튼으로 메일을 직접 보내주세요.";
      showManualMailBtn = true;
    } else if(state.autoSubmit === "not-configured"){
      statusMsg = "메일 앱이 열리면 '보내기'를 눌러야 담당자에게 최종 접수돼요.";
      showManualMailBtn = true;
    }

    return `
      <div class="entry-card">
        <h4>🎉 응모가 완료되었어요</h4>
        <p class="desc">${statusMsg}</p>
        <div class="success-box">
          <div>응모번호</div>
          <div class="no">${state.entry.entryNo}</div>
          <p>${esc(state.entry.name)}님, 참여해 주셔서 감사합니다.</p>
        </div>
        ${showManualMailBtn ? `<button class="submit-btn" style="margin-top:12px;" onclick="window.location.href='${buildMailtoLink(state.entry)}'">담당자에게 메일 보내기</button>` : ''}
      </div>
    `;
  }

  if(!allDone){
    return `
      <div class="entry-card locked">
        <h4>🔒 경품 응모</h4>
        <p class="desc">3개소 스탬프를 모두 모으면 경품 응모가 열려요.</p>
        <div class="lock-msg">아직 ${CONFIG.stations.length - CONFIG.stations.filter(s=>state.visited[s.id]).length}곳 남았어요</div>
      </div>
    `;
  }

  const webAppReady = !!(CONFIG.webAppUrl || "").trim();
  return `
    <div class="entry-card" id="entryForm">
      <h4>🎉 완주를 축하합니다!</h4>
      <p class="desc">아래 정보를 입력하고 경품 추첨에 응모하세요.</p>
      <div class="field">
        <label>성명</label>
        <input type="text" id="entryName" placeholder="홍길동">
      </div>
      <div class="field">
        <label>휴대전화번호</label>
        <input type="tel" id="entryPhone" placeholder="010-0000-0000">
      </div>
      <label class="consent">
        <input type="checkbox" id="entryConsent">
        경품 추첨 및 안내를 위한 개인정보(성명, 휴대전화번호) 수집·이용에 동의합니다.
      </label>
      <button class="submit-btn" onclick="handleSubmit()">제출</button>
      ${!webAppReady ? `<div class="gps-feedback warn" style="margin-top:10px;">⚠ 관리자용 안내: CONFIG.webAppUrl이 비어 있어 수동 메일(mailto) 방식으로만 동작합니다.</div>` : ''}
    </div>
  `;
}

function handleSubmit(){
  const name = document.getElementById("entryName").value;
  const phone = document.getElementById("entryPhone").value;
  const consent = document.getElementById("entryConsent").checked;
  if(!name.trim() || !phone.trim()){ alert("이름과 연락처를 입력해 주세요."); return; }
  if(!consent){ alert("개인정보 수집·이용에 동의해 주세요."); return; }
  submitEntry(name, phone, consent);
}

render();
loadState();
</script>
</body>
</html>
