// ===== 하베신(Haversine) 공식을 이용한 두 좌표 간 거리 계산 함수 =====
const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371000; // 지구 반지름 (미터)
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLon = ((lon2 - lon1) * Math.PI) / 180;
  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos((lat1 * Math.PI) / 180) *
      Math.cos((lat2 * Math.PI) / 180) *
      Math.sin(dLon / 2) *
      Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return Math.round(R * c); // 거리를 미터 단위로 반환
};

귀하는 본 개인정보 처리위탁 및 재위탁에 대한 동의를 거부할 권리가 있습니다. 단, 동의를 거부하실 경우 모바일 스탬프 투어 참여 및 경품 발송 서비스 이용이 불가능합니다.`,
  },
  {
    label: '[필수]',
    title: '이벤트 유의사항 동의',
    subtitle: '[이벤트 유의사항 동의]',
    content: `본 이벤트의 유의사항을 꼭 확인해 주세요.

▪ 본 이벤트는 1인 1회 참여를 원칙으로 하며, 부정한 방법(타인 명의 도용 등)으로 참여 시 당첨이 취소될 수 있습니다.

▪ 잘못 입력된 연락처로 인해 경품이 오 발송된 경우 재발송되지 않으므로 개인정보를 정확히 입력해 주시기 바랍니다.

▪ 경품은 이벤트 마감 후 일괄 발송됩니다.`,
  },
];

function StampTourApp() {
  // ===== 스탬프 상태 =====
  const [places, setPlaces] = useState(
    INITIAL_PLACES.map((p) => ({ ...p, verified: false, verifying: false }))
  );

  // ===== GPS 인증 관련 상태 =====
  const [gpsTestModal, setGpsTestModal] = useState(null); // { placeId, distance }

  // ===== 참여자 정보 =====
  const [form, setForm] = useState({ name: '', phone: '', email: '' });

  // ===== 동의서 =====
  const [agreements, setAgreements] = useState([false, false, false, false]);
  const [agreementModalIdx, setAgreementModalIdx] = useState(null);

  // ===== 응모 완료 / 토스트 / 메일 전송 =====
  const [toast, setToast] = useState('');

  // ===== [당첨확률 높이기(응모조회)] =====
  const [showInquiryModal, setShowInquiryModal] = useState(false); // 당첨확률 높이기 모달
  const [inquiryData, setInquiryData] = useState(null); // 조회된 응모 기록 (없으면 null)
  const [extraPhoto, setExtraPhoto] = useState(null); // 후기 사진 (base64)
  const [extraText, setExtraText] = useState(''); // 후기 및 SNS 인증 내용
  const [isEditingExtra, setIsEditingExtra] = useState(true); // true=입력/수정 모드, false=조회(읽기전용) 모드
  const [editBackup, setEditBackup] = useState(null); // 수정 취소 시 되돌릴 이전 값 { photo, text }
  const [showSendConfirm, setShowSendConfirm] = useState(false); // 메일 앱에서 돌아온 뒤 '실제로 보냈는지' 확인하는 팝업
  const [showResendComplete, setShowResendComplete] = useState(false); // 메일 발송 완료 안내 팝업
  const [showMailtoConfirm, setShowMailtoConfirm] = useState(false); // 필수 확인사항 모달

  // ===== 개인 인증(이름/핸드폰) 화면 전환 및 중복참여 확인 =====
  // '제출하기'를 눌러 최종 제출된 경우에만 중복참여로 간주 (그 전 단계는 몇 번을 다시 시작해도 무방)
  const [authenticated, setAuthenticated] = useState(false); // 이름/핸드폰 확인 후 스탬프 화면으로 전환
  const [alreadySubmitted, setAlreadySubmitted] = useState(false); // 이 기기에서 이미 최종 제출을 완료했는지
  const [justSubmitted, setJustSubmitted] = useState(false); // 방금 이 세션에서 막 제출을 완료한 것인지(재방문과 구분하기 위함)

  useEffect(() => {
    try {
      if (localStorage.getItem('stamp_tour_submitted') === 'true') {
        setAlreadySubmitted(true);
      }
    } catch (e) {
      // localStorage를 사용할 수 없는 환경이면 무시하고 정상 진행
    }
  }, []);

  // ===== [개인정보 보호] 일정 기간이 지난 응모기록(이름/연락처/사진 등)은 이 기기에서 자동 삭제 =====
  // 참여 여부(중복참여 방지) 자체는 계속 유지하되, 개인정보가 담긴 상세 기록만 정리함
  useEffect(() => {
    try {
      const saved = localStorage.getItem('stamp_tour_submission');
      if (saved) {
        const data = JSON.parse(saved);
        if (data.submittedAt) {
          const elapsedDays = (Date.now() - new Date(data.submittedAt).getTime()) / (1000 * 60 * 60 * 24);
          if (elapsedDays > LOCAL_DATA_RETENTION_DAYS) {
            localStorage.removeItem('stamp_tour_submission');
          }
        }
      }
    } catch (e) {
      // 저장된 데이터가 손상되었거나 localStorage를 사용할 수 없으면 무시
    }
  }, []);

  // ===== [진행상황 저장/복원] 이동 중 브라우저를 껐다 켜도 인증 기록이 유지되도록 함 =====
  // 최초 마운트 시 1회만 저장된 진행상황을 불러와 복원
  useEffect(() => {
    try {
      const saved = localStorage.getItem('stamp_tour_progress');
      if (saved) {
        const data = JSON.parse(saved);
        if (data.authenticated) setAuthenticated(true);
        if (data.form) setForm(data.form);
        if (Array.isArray(data.agreements) && data.agreements.length === 4) {
          setAgreements(data.agreements);
        }
        if (Array.isArray(data.places)) {
          // 좌표/아이콘 등 고정 정보는 INITIAL_PLACES 기준을 유지하고, verified 값만 복원
          setPlaces((prev) =>
            prev.map((p) => {
              const savedPlace = data.places.find((sp) => sp.id === p.id);
              return savedPlace ? { ...p, verified: !!savedPlace.verified } : p;
            })
          );
        }
      }
    } catch (e) {
      // 저장된 데이터가 손상되었거나 localStorage를 사용할 수 없으면 무시하고 처음부터 진행
    }
  }, []);

  // 진행상황이 바뀔 때마다 자동 저장 (이름/핸드폰/이메일, 인증여부, 장소별 인증현황, 동의여부)
  useEffect(() => {
    // 최종 제출을 이미 마친 경우는 더 이상 진행상황을 저장할 필요가 없음
    if (alreadySubmitted) return;
    try {
      const progress = {
        authenticated,
        form,
        agreements,
        places: places.map((p) => ({ id: p.id, verified: p.verified })),
      };
      localStorage.setItem('stamp_tour_progress', JSON.stringify(progress));
    } catch (e) {
      // 저장 공간 부족(용량 초과) 등으로 저장에 실패해도 앱 사용에는 지장 없도록 무시
    }
  }, [authenticated, form, agreements, places, alreadySubmitted]);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 2000);
  };

  // ===== 핸드폰 번호 입력 시 자동으로 '-' 삽입 =====
  const formatPhoneNumber = (value) => {
    const digits = value.replace(/\D/g, '').slice(0, 11); // 숫자만 추출, 최대 11자리
    if (digits.length < 4) return digits;
    if (digits.length < 8) return `${digits.slice(0, 3)}-${digits.slice(3)}`;
    // 서울 지역번호(02) 등은 고려하지 않고 010 등 휴대폰 번호 기준(3-4-4)으로 처리
    return `${digits.slice(0, 3)}-${digits.slice(3, 7)}-${digits.slice(7)}`;
  };

  const allVerified = places.every((p) => p.verified);
  const verifiedCount = places.filter((p) => p.verified).length;
  const allAgreed = agreements.every(Boolean);
  // 화면 노출 여부와 무관하게 실제 제출 가능 조건에 3곳 장소인증 완료를 명시적으로 포함
  const canSubmit = allVerified && allAgreed && form.name.trim() && form.phone.trim() && form.email.trim();

  // ===== [화면 1] 개인 인증(이름/핸드폰/이메일) 확인 후 스탬프 화면으로 전환 =====
  const handleStartAuth = () => {
    if (!form.name.trim() || !form.phone.trim() || !form.email.trim()) {
      showToast('이름, 핸드폰 번호, 이메일을 모두 입력해주세요');
      return;
    }
    setAuthenticated(true);
  };

  // ===== GPS 장소인증 (하베신 공식 + 허용 반경 확인) =====
  const handleLocationVerify = (placeId) => {
    const place = places.find((p) => p.id === placeId);
    if (!place) return;

    setPlaces((prev) => prev.map((p) => (p.id === placeId ? { ...p, verifying: true } : p)));

    // 브라우저 Geolocation API를 통해 사용자의 현재 위치 수신
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          // GPS 수신 성공: 사용자의 현재 위도/경도
          const userLat = position.coords.latitude;
          const userLon = position.coords.longitude;

          // 하베신 공식으로 사용자 위치와 장소 간 거리 계산 (단위: 미터)
          const distance = calculateDistance(userLat, userLon, place.latitude, place.longitude);

          // 허용 반경 이내면 바로 인증 성공
          if (distance <= GPS_VERIFY_RADIUS_M) {
            setTimeout(() => {
              setPlaces((prev) =>
                prev.map((p) => (p.id === placeId ? { ...p, verifying: false, verified: true } : p))
              );
              showToast(`✓ ${place.name} 장소인증 완료!`);
            }, 1000);
          } else {
            // 허용 반경 초과: 범위 초과 안내 모달 표시 (실제 거리 정보 포함)
            setTimeout(() => {
              setPlaces((prev) =>
                prev.map((p) => (p.id === placeId ? { ...p, verifying: false } : p))
              );
              setGpsTestModal({ placeId, distance, placeName: place.name });
            }, 1000);
          }
        },
        (error) => {
          // GPS 수신 실패: 실패 사유별로 안내 메시지를 구분해서 모달에 표시
          // 1=권한 거부, 2=위치 확인 불가, 3=시간 초과
          let errorMessage = '위치 정보를 수신할 수 없습니다.';
          if (error.code === 1) {
            errorMessage = '위치 권한이 거부되었습니다. 브라우저/기기 설정에서 위치 접근을 허용해주세요.';
          } else if (error.code === 2) {
            errorMessage = '현재 위치를 확인할 수 없습니다. 실내이거나 GPS 신호가 약한 곳일 수 있어요.';
          } else if (error.code === 3) {
            errorMessage = 'GPS 신호를 잡는 데 시간이 오래 걸리고 있어요. 하늘이 잘 보이는 곳에서 다시 시도해주세요.';
          }
          setTimeout(() => {
            setPlaces((prev) =>
              prev.map((p) => (p.id === placeId ? { ...p, verifying: false } : p))
            );
            setGpsTestModal({ placeId, distance: null, placeName: place.name, errorMessage });
          }, 1000);
        },
        {
          // 3초는 실제 GPS가 위치를 확정하기엔 너무 짧아 장소와 무관하게 자주 실패했음 → 15초로 연장
          timeout: 15000,
          enableHighAccuracy: true, // 정확도를 높여 판정 오차를 줄임 (네트워크 기반 대략 위치 대신 실제 GPS 사용)
          maximumAge: 10000, // 10초 이내에 확인한 위치가 있으면 재사용해 다음 장소 인증 시 더 빠르게 응답
        }
      );
    } else {
      // Geolocation API 미지원: 안내 모달 표시
      setTimeout(() => {
        setPlaces((prev) =>
          prev.map((p) => (p.id === placeId ? { ...p, verifying: false } : p))
        );
        setGpsTestModal({
          placeId,
          distance: null,
          placeName: place.name,
          errorMessage: '이 브라우저는 위치 정보 기능을 지원하지 않습니다.',
        });
      }, 1000);
    }
  };

  // ===== GPS 인증 실패/범위초과 안내 모달에서 '다시 시도' 버튼 클릭 시 재측정 =====
  const handleRetryVerify = () => {
    if (gpsTestModal) {
      const placeId = gpsTestModal.placeId;
      setGpsTestModal(null);
      handleLocationVerify(placeId);
    }
  };

  // ===== GPS 인증 실패/범위초과 안내 모달 닫기 =====
  const handleCancelVerify = () => {
    setGpsTestModal(null);
  };

  // ===== 사진 파일을 리사이즈·압축해서 base64로 변환하는 공용 함수 (응모내역 조회 화면의 '사진 재송부/등록' 기능에서 사용) =====
  // 실제 폰 카메라 사진(수 MB)을 원본 그대로 저장하면 사진 몇 장만으로도 localStorage 용량을 넘길 수 있음.
  // 앱에 남기는 사본은 화면 미리보기용일 뿐이고(실제 첨부는 사용자가 이메일 앱에서 직접 첨부) 화질이 작아도
  // 무방하므로 캔버스로 축소·압축한 뒤 base64로 저장
  const compressImageFile = (file, onSuccess, onError) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX_SIZE = 640; // 긴 변 기준 최대 640px로 축소
        let { width, height } = img;
        if (width > height && width > MAX_SIZE) {
          height = Math.round((height * MAX_SIZE) / width);
          width = MAX_SIZE;
        } else if (height > MAX_SIZE) {
          width = Math.round((width * MAX_SIZE) / height);
          height = MAX_SIZE;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        // JPEG 60% 품질로 압축 (용량을 대폭 줄이면서도 미리보기 용도로는 충분한 화질)
        onSuccess(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = () => onError && onError();
      img.src = reader.result;
    };
    reader.onerror = () => onError && onError();
    reader.readAsDataURL(file);
  };

  // ===== 동의서 =====
  const confirmAgreement = (idx) => {
    setAgreements((prev) => prev.map((a, i) => (i === idx ? true : a)));
    setAgreementModalIdx(null);
  };

  // ===== 메일 본문 생성 (스탬프 투어 응모 정보 - 사진/후기는 나중에 별도 제출) =====
  const buildEmailBody = () => {
    const completedPlaces = places.filter((p) => p.verified).map((p) => p.name).join(', ') || '없음';

    return `[보령 해양생태로드 모바일 스탬프 투어 응모 정보]

1. 참가자 인적사항
- 이름: ${form.name}
- 핸드폰 번호: ${form.phone}
- 이메일: ${form.email}

2. 스탬프 인증 현황
- 완료한 스탬프 장소: ${completedPlaces}

3. 약관 동의 현황
- 동의 여부: 필수 동의 4종(개인정보 수집·이용, 위치정보 이용, 개인정보 처리위탁, 이벤트 유의사항) 전원 동의 완료

※ 후기 사진 및 SNS 인증은 '당첨확률 높이기(응모조회)' 메뉴에서 별도로 제출됩니다.
--------------------------------------------------`;
  };

  // ===== '제출하기' 버튼 클릭 시: 먼저 필수 확인사항 모달을 띄움 =====
  const handleSubmit = () => {
    if (!canSubmit) return;
    setShowMailtoConfirm(true);
  };

  // ===== 최종 제출 마무리 공통 로직 (메일 앱 실행 + 중복참여 플래그/응모기록 저장) =====
  const finalizeSubmit = () => {
    const subject = encodeURIComponent(`[보령 해양생태로드 스탬프투어] ${form.name}님 응모`);
    const body = encodeURIComponent(buildEmailBody());
    // mailto: 링크는 파일을 자동 첨부할 수 없으므로, 사용자가 이메일 앱에서 직접 사진을 첨부해야 함
    const mailtoLink = `mailto:${ADMIN_EMAIL}?subject=${subject}&body=${body}`;

    window.location.href = mailtoLink; // 사용자의 기본 이메일 앱 실행
    setShowMailtoConfirm(false);
    // 최종 제출을 완료한 시점부터만 '참여함'으로 간주 (그 전까지는 중복참여로 걸리지 않음)
    try {
      localStorage.setItem('stamp_tour_submitted', 'true');
      // [당첨확률 높이기(응모조회)용] 이 기기에서 나중에 다시 볼 수 있도록 영구 저장
      // (진행 중이던 임시 저장분과 달리, 제출 후에도 삭제하지 않고 남겨둠)
      const submissionRecord = {
        name: form.name,
        phone: form.phone,
        email: form.email,
        submittedAt: new Date().toISOString(),
        places: places.map((p) => ({ id: p.id, name: p.name, verified: p.verified })),
        extraPhoto: null, // 후기 사진 (당첨확률 높이기 화면에서 등록)
        extraText: '', // 후기 및 SNS 인증 내용 (당첨확률 높이기 화면에서 등록)
      };
      localStorage.setItem('stamp_tour_submission', JSON.stringify(submissionRecord));
      localStorage.removeItem('stamp_tour_progress'); // 제출 완료했으니 임시 진행상황 저장분은 정리
    } catch (e) {
      // localStorage를 사용할 수 없는 환경이면 무시
    }
    // 별도의 '응모완료' 화면 대신, 아래의 '참여 완료' 화면을 그대로 재사용해 안내 중복을 없앰
    setJustSubmitted(true); // 방금 막 제출한 것이므로, '이미 참여 완료'가 아니라 '최종 참여 완료' 문구가 뜨도록 표시
    setAlreadySubmitted(true);
  };

  // ===== [당첨확률 높이기(응모조회)] 이 기기에 저장된 마지막 응모 기록을 불러와 모달로 표시 =====
  const openInquiryModal = () => {
    try {
      const saved = localStorage.getItem('stamp_tour_submission');
      const parsed = saved ? JSON.parse(saved) : null;
      setInquiryData(parsed);
      const savedPhoto = parsed?.extraPhoto || null;
      const savedText = parsed?.extraText || '';
      setExtraPhoto(savedPhoto);
      setExtraText(savedText);
      // 이미 등록해둔 사진/후기가 있으면 조회(읽기전용) 모드로, 없으면 바로 입력 가능하도록 수정 모드로 시작
      setIsEditingExtra(!(savedPhoto || savedText.trim()));
    } catch (e) {
      setInquiryData(null);
      setIsEditingExtra(true);
    }
    setShowInquiryModal(true);
  };

  // ===== [당첨확률 높이기] '수정하기' 클릭 시: 현재 값을 백업해두고 수정 모드로 전환 =====
  const startEditExtra = () => {
    setEditBackup({ photo: extraPhoto, text: extraText });
    setIsEditingExtra(true);
  };

  // ===== [당첨확률 높이기] '취소' 클릭 시: 백업해둔 값으로 되돌리고 조회 모드로 복귀 =====
  const cancelEditExtra = () => {
    if (editBackup) {
      setExtraPhoto(editBackup.photo);
      setExtraText(editBackup.text);
    }
    setEditBackup(null);
    setIsEditingExtra(false);
  };

  // ===== [당첨확률 높이기] 사진등록 - 선택 즉시 압축 후 미리보기 저장 =====
  const handleExtraPhotoChange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    compressImageFile(
      file,
      (compressedDataUrl) => setExtraPhoto(compressedDataUrl),
      () => showToast('사진을 불러오지 못했습니다. 다시 시도해주세요.')
    );
    e.target.value = '';
  };

  // ===== [당첨확률 높이기] 사진/후기/SNS링크를 관리자에게 메일로 제출 =====
  const submitExtraEntry = () => {
    if (!inquiryData) return;
    if (!extraPhoto && !extraText.trim()) {
      showToast('사진 또는 후기/SNS 링크 중 하나는 등록해주세요.');
      return;
    }
    try {
      const updated = { ...inquiryData, extraPhoto, extraText };
      localStorage.setItem('stamp_tour_submission', JSON.stringify(updated));
      setInquiryData(updated);
    } catch (e) {
      // 저장 실패해도 메일 발송 자체는 계속 진행
    }

    const subject = encodeURIComponent(
      `[보령 해양생태로드 스탬프투어] 당첨확률 높이기 - ${inquiryData.name}님`
    );
    const body = encodeURIComponent(
      `[당첨확률 높이기 - 후기/SNS 인증 제출]

▪ 참가자 정보
- 이름: ${inquiryData.name}
- 핸드폰 번호: ${inquiryData.phone}
- 이메일: ${inquiryData.email}

▪ 후기 및 SNS 인증 내용
${extraText.trim() || '(작성한 내용 없음)'}

▪ 사진 등록 여부
${extraPhoto ? '등록함 (아래 안내에 따라 첨부파일로 추가해주세요)' : '등록 안 함'}

▪ 제출 일시
${new Date().toLocaleString('ko-KR')}
${extraPhoto ? `\n★ 이메일 앱이 열리면, 방금 등록하신 사진을 '첨부파일'로 직접 추가한 뒤 반드시 '보내기'를 눌러 전송을 완료해주세요. ★` : ''}
--------------------------------------------------`
    );
    const mailtoLink = `mailto:${ADMIN_EMAIL}?subject=${subject}&body=${body}`;
    window.location.href = mailtoLink;
    // mailto:는 메일 앱을 여는 것까지만 할 수 있고, 실제로 '보내기'를 눌렀는지는 알 수 없음
    // → 바로 완료 처리하지 않고, 메일 앱에서 돌아온 사용자에게 직접 전송 여부를 확인받음
    setShowSendConfirm(true);
  };

  // ===== [당첨확률 높이기] 메일 앱에서 돌아온 뒤 '정말 보냈는지' 확인 =====
  const confirmSendCompleted = () => {
    setShowSendConfirm(false);
    setEditBackup(null);
    setIsEditingExtra(false); // 실제로 보냈다고 확인한 경우에만 조회(읽기전용) 모드로 전환
    setShowResendComplete(true);
  };

  const confirmSendFailed = () => {

    setShowSendConfirm(false);

                        <div className="flex gap-2">

                    <>
                      {/* 조회(읽기전용) 모드: 이미 등록해둔 내용을 텍스트로만 보여줌 */}
                      <div className="space-y-3 mb-3">
                        {extraPhoto && (
                          <img src={extraPhoto} alt="등록된 사진" className="w-full h-40 object-cover rounded-2xl" />

                        <div>
                          <p className="text-xs font-bold text-stone-500 mb-1">등록된 후기 · SNS 인증 내용</p>
                          <p className="text-sm text-stone-800 whitespace-pre-line bg-orange-50 rounded-xl px-3 py-2.5">
                            {extraText.trim() || '(작성한 내용 없음)'}
                          </p>
                        </div>
                      </div>
                      <button
                        onClick={startEditExtra}
                        className="w-full py-3 rounded-xl text-sm font-bold bg-white border-2 border-orange-500 text-orange-600 hover:bg-orange-50"
                      >
                        ✏️ 수정하기
                      </button>
                    </>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ===== 메일 송부 완료 팝업 (당첨확률 높이기 메일 앱 실행 직후) ===== */}
      {/* ===== 메일 전송 여부 확인 팝업 (mailto는 실제 전송 여부를 알 수 없어 사용자에게 직접 확인받음) ===== */}
      {showSendConfirm && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-6">
          <div className="w-full max-w-sm bg-white rounded-2xl overflow-hidden shadow-xl text-center">
            <div className="px-6 pt-8 pb-6">
              <div className="w-16 h-16 rounded-full bg-orange-100 flex items-center justify-center mx-auto mb-4">
                <Mail className="w-9 h-9 text-orange-500" />
              </div>
              <h3 className="text-lg font-extrabold text-stone-800 mb-2">메일을 전송하셨나요?</h3>
              <p className="text-sm text-stone-600 leading-relaxed">
                이메일 앱에서 '보내기'까지 완료하셨다면<br />
                '네, 보냈어요'를 눌러주세요.
              </p>
            </div>
            <div className="flex border-t border-stone-100">
              <button
                onClick={confirmSendFailed}
                className="flex-1 py-3 text-sm font-bold text-stone-500 hover:bg-stone-50"
              >
                아니요, 다시 할게요
              </button>
              <button
                onClick={confirmSendCompleted}
                className="flex-1 py-3 text-sm font-bold text-orange-600 hover:bg-orange-50 border-l border-stone-100"
              >
                네, 보냈어요
              </button>
            </div>
          </div>
        </div>
      )}

      {showResendComplete && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-6">
          <div className="w-full max-w-sm bg-white rounded-2xl overflow-hidden shadow-xl text-center">
            <div className="px-6 pt-8 pb-6">
              <div className="w-16 h-16 rounded-full bg-orange-500 flex items-center justify-center mx-auto mb-4">
                <CheckCircle2 className="w-9 h-9 text-white" />
              </div>
              <h3 className="text-lg font-extrabold text-stone-800">제출 완료</h3>
            </div>
            <button
              onClick={() => setShowResendComplete(false)}
              className="w-full py-3 text-sm font-bold bg-orange-500 text-white hover:bg-orange-600"
            >
              확인
            </button>
          </div>
        </div>
      )}
    </>
  );

  if (alreadySubmitted) {
    return (
      <div className="min-h-screen w-full max-w-md mx-auto overflow-x-hidden bg-orange-50 flex flex-col items-center justify-center px-8 text-center">
        <div className="w-24 h-24 rounded-full bg-orange-500 flex items-center justify-center mb-6">
          <span className="text-5xl">👍</span>
        </div>
        <h1 className="text-2xl font-extrabold mb-3 text-stone-800">
          {justSubmitted ? '최종 참여가 완료되었습니다!' : '이미 참여 완료하셨습니다'}
        </h1>
        <p className="leading-relaxed text-base text-stone-600">
          {justSubmitted ? (

            <>보령 해양생태로드 스탬프 투어는<br />1인 1회 참여만 가능합니다.</>

        <p className="leading-relaxed text-sm text-stone-500 mt-2">

        <button

      </div>

      {!authenticated && (
        /* ===== [화면 1] 개인 인증 (이름/핸드폰 번호로 중복참여 확인 후 스탬프 화면으로 이동) ===== */
        <div className="px-6 mt-4">
          <div className="bg-white rounded-2xl border border-orange-200 p-5 shadow-sm">
            <p className="text-base font-extrabold text-orange-600 mb-1">🙋 참여자 확인</p>
            <p className="text-sm text-stone-500 mb-2">이름, 핸드폰 번호, 이메일을 입력하면 스탬프 투어를 시작할 수 있어요</p>
            <p className="text-xs text-stone-400 mb-4">📱 개인정보 보호를 위해 <b>본인 기기</b>로 참여해주세요.</p>

            <div className="space-y-4">
              <div>
                <label className="text-sm font-bold flex items-center gap-1 mb-1.5 text-stone-800">
                  <User className="w-4 h-4" /> 이름
                </label>
                <input
                  type="text"
                  value={form.name}
                  onChange={(e) => setForm({ ...form, name: e.target.value })}
                  placeholder="이름을 입력해주세요"
                  className="w-full border border-orange-100 rounded-xl px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 text-stone-800"
                />
              </div>

              <div>
                <label className="text-sm font-bold flex items-center gap-1 mb-1.5 text-stone-800">
                  <Phone className="w-4 h-4" /> 핸드폰 번호
                </label>
                <input
                  type="tel"
                  value={form.phone}
                  onChange={(e) => setForm({ ...form, phone: formatPhoneNumber(e.target.value) })}
                  placeholder="010-0000-0000"
                  maxLength={13}
                  className="w-full border border-orange-100 rounded-xl px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 text-stone-800"
                />
              </div>

              <div>
                <label className="text-sm font-bold flex items-center gap-1 mb-1.5 text-stone-800">
                  <Mail className="w-4 h-4" /> 이메일
                </label>
                <input
                  type="email"
                  value={form.email}
                  onChange={(e) => setForm({ ...form, email: e.target.value })}
                  placeholder="example@email.com"
                  className="w-full border border-orange-100 rounded-xl px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 text-stone-800"
                />
              </div>

              <button
                onClick={handleStartAuth}
                className="w-full py-3.5 rounded-2xl text-lg font-extrabold transition bg-orange-500 text-white hover:bg-orange-600"
              >
                확인 및 시작하기
              </button>
            </div>
          </div>
        </div>
      )}

      {authenticated && (
      <>
      {/* ===== 진행 상황 바 (장소인증만 필수) ===== */}
      <div className="px-6 mt-4">
        <div className="bg-orange-100 rounded-2xl shadow-md px-5 py-4">
          <div className="flex items-center justify-between mb-2">
            <span className="text-base font-bold text-orange-600">장소 인증 현황</span>
            <span className="text-base font-extrabold text-orange-600">{verifiedCount} / 3</span>
          </div>
          <div className="w-full h-2.5 bg-orange-200 rounded-full overflow-hidden">
            <div
              className="h-full bg-orange-500 rounded-full transition-all duration-500"
              style={{ width: `${(verifiedCount / 3) * 100}%` }}
            />
          </div>
        </div>
      </div>

      {/* ===== 스탬프 장소 카드 ===== */}
      <div className="px-6 mt-6 space-y-4">
        <div className="flex items-center gap-2 px-1">
          <ChevronRight className="w-4 h-4 text-orange-600" />
          <h2 className="text-lg font-extrabold text-stone-800">스탬프 인증</h2>
        </div>
        {places.map((place) => {
          const { Icon } = place;
          return (
            <div key={place.id} className="bg-white rounded-2xl shadow-md overflow-hidden border border-orange-200">
              <div className={`h-28 bg-gradient-to-br ${place.grad} flex items-center justify-between px-5 relative`}>
                <div>
                  <span className="text-sm font-bold text-white bg-black/25 px-2 py-1 rounded-full">
                    {place.category}
                  </span>
                  <p className="text-white text-xl font-extrabold mt-2 drop-shadow-md">{place.name}</p>
                </div>
                <Icon className="w-10 h-10 text-white/90" />
                {/* 인증 완료 스탬프 마크 (최초 버전: 빨간 원형 도장) */}
                {place.verified ? (
                  <div className="absolute -right-2 -bottom-3 w-16 h-16 rounded-full border-4 border-white bg-red-500/90 flex items-center justify-center -rotate-12 shadow-lg">
                    <span className="text-xs font-extrabold leading-tight text-center text-white">인증<br />완료</span>
                  </div>
                ) : (
                  /* 미획득 스탬프 - 연한 회색 톤으로 흐림 처리 + 잠금 아이콘 */
                  <div className="absolute -right-2 -bottom-3 w-16 h-16 rounded-full border-4 border-white bg-stone-100 flex items-center justify-center opacity-50">
                    <Lock className="w-6 h-6 text-stone-400" />
                  </div>
                )}
              </div>

              <div className="p-4">
                <p className="text-base leading-relaxed mb-4 text-stone-600">{place.desc}</p>

                {/* 장소인증 버튼 - GPS 인증 (필수) */}
                <button
                  onClick={() => handleLocationVerify(place.id)}
                  disabled={place.verified || place.verifying}
                  className={`w-full flex items-center justify-center gap-1.5 py-2.5 rounded-xl text-sm font-bold transition
                    ${place.verified
                      ? 'bg-orange-100 text-orange-600'
                      : 'bg-orange-500 text-white hover:bg-orange-600'}`}
                >
                  {place.verifying ? (
                    <>
                      <Loader2 className="w-4 h-4 animate-spin" /> GPS 확인중
                    </>
                  ) : place.verified ? (
                    <>
                      <CheckCircle2 className="w-4 h-4" /> 장소인증 완료
                    </>
                  ) : (
                    <>
                      <MapPin className="w-4 h-4" /> 장소인증
                    </>
                  )}
                </button>
              </div>
            </div>
          );
        })}
      </div>

      {/* ===== 이벤트 응모 섹션 (인증 완료 후 항상 표시, 제출은 3곳 인증 완료 시에만 가능) ===== */}
      <div className="px-6 mt-8 space-y-4">
        <div className="flex items-center gap-2 px-1">
          <ChevronRight className="w-4 h-4 text-orange-600" />
          <h2 className="text-lg font-extrabold text-stone-800">이벤트 응모 및 참여자 정보</h2>
        </div>

        <div className="bg-white rounded-2xl shadow-md border border-orange-200 p-5">
          {/* 참여자 확인 완료 안내 (이름/핸드폰/이메일은 앞서 확인한 정보를 그대로 사용) */}
          <div className="bg-orange-100 rounded-xl px-4 py-3 space-y-2">
            <div className="flex items-center gap-2 text-sm">
              <span className="w-20 flex-shrink-0 font-bold text-orange-600">이름</span>
              <span className="text-stone-800">{form.name}</span>
            </div>
            <div className="flex items-center gap-2 text-sm">
              <span className="w-20 flex-shrink-0 font-bold text-orange-600">핸드폰번호</span>
              <span className="text-stone-800">{form.phone}</span>
            </div>
            <div className="flex items-center gap-2 text-sm">
              <span className="w-20 flex-shrink-0 font-bold text-orange-600">이메일 주소</span>
              <span className="text-stone-800">{form.email}</span>
            </div>
          </div>
        </div>

        {/* ===== 필수 동의 체크박스 ===== */}
        <div className="flex items-center gap-2 px-1">
          <ChevronRight className="w-4 h-4 text-orange-600" />
          <h2 className="text-lg font-extrabold text-stone-800">필수 동의 항목</h2>
        </div>
        <div className="bg-white rounded-2xl shadow-md border border-orange-200 p-5 space-y-3">
          {AGREEMENTS.map((a, idx) => (
            <button
              key={idx}
              onClick={() => setAgreementModalIdx(idx)}
              className="w-full flex items-center justify-between gap-3 py-2 text-left"
            >
              <div className="flex items-center gap-2.5">
                <span
                  className={`w-5 h-5 rounded-md flex items-center justify-center flex-shrink-0 border-2
                    ${agreements[idx] ? 'bg-orange-500 border-orange-400' : 'border-orange-50'}`}
                >
                  {agreements[idx] && <Check className="w-3.5 h-3.5 text-white" />}
                </span>
                <span className="text-base font-medium text-stone-800">
                  {a.label} {a.title}
                </span>
              </div>
              <ChevronRight className="w-4 h-4 flex-shrink-0 text-stone-400" />
            </button>
          ))}
        </div>

        {/* ===== 제출하기 버튼 ===== */}
        <button
          onClick={handleSubmit}
          disabled={!canSubmit}
          className={`w-full py-3.5 rounded-2xl text-lg font-extrabold transition
            ${canSubmit
              ? 'bg-orange-500 text-white shadow-lg hover:bg-orange-600'
              : 'bg-stone-200 text-stone-400'}`}
        >
          제출하기
        </button>
      </div>
      </>
      )}

      {inquiryModals}

      {/* ===== 사진 첨부 안내 모달 (제출완료 클릭 시 - mailto 전송 전 최종 확인) ===== */}
      {showMailtoConfirm && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-6">
          <div className="w-full max-w-md bg-white rounded-2xl overflow-hidden shadow-2xl">
            <div className="bg-orange-600 px-6 py-6 text-center relative">
              <button
                onClick={() => setShowMailtoConfirm(false)}
                className="absolute top-3 right-3 text-white/80 hover:text-white"
              >
                <X className="w-5 h-5" />
              </button>
              <AlertCircle className="w-10 h-10 text-white mx-auto mb-2" />
              <h3 className="text-xl font-extrabold text-white">잠깐! 필수 확인사항</h3>
            </div>

            <div className="p-6 space-y-4">
              <div className="bg-orange-100 border-2 border-orange-600 rounded-xl p-4 space-y-2">
                <p className="text-sm leading-relaxed text-stone-700">
                  <span className="font-extrabold text-red-600">① 스탬프 투어 결과는 반드시 메일로 제출해야 접수가 완료돼요.</span><br />
                  아래 버튼을 눌러 이메일 앱을 열고, 꼭 <b>'보내기'</b>까지 눌러주세요.
                </p>
                <p className="text-sm leading-relaxed text-stone-700">
                  <span className="font-extrabold text-orange-600">② 후기 사진을 등록하면 이벤트 당첨 확률이 높아져요!</span><br />
                  제출 완료 후 <b>'당첨확률 높이기(응모조회)'</b>에서 후기 사진과 SNS 인증을 추가로 등록해주세요.
                </p>
              </div>

              <div className="pt-2">
                <button
                  onClick={finalizeSubmit}
                  className="w-full py-3 rounded-full text-sm font-bold bg-orange-500 text-white hover:bg-orange-600"
                >
                  스탬프 최종 제출
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ===== GPS 인증 실패/범위초과 안내 모달 ===== */}
      {gpsTestModal && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-6">
          <div className="w-full max-w-md bg-white rounded-2xl overflow-hidden shadow-2xl">
            <div className="bg-orange-600 px-6 py-6">
              <div className="flex items-center gap-3 mb-2">
                <AlertCircle className="w-6 h-6 text-white" />
                <h3 className="text-xl font-extrabold text-white">위치 인증 실패</h3>
              </div>
            </div>

            <div className="p-6 space-y-4">
              <p className="font-bold text-base text-stone-800">📍 {gpsTestModal.placeName}</p>

              {gpsTestModal.distance !== null && (
                <div className="bg-orange-100 rounded-xl p-4 border border-orange-100">
                  <p className="text-sm font-medium mb-1 text-stone-600">현재 위치와의 거리:</p>
                  <p className="text-2xl font-extrabold text-orange-600">{gpsTestModal.distance}m</p>
                  <p className="text-sm font-medium mt-2 text-stone-500">
                    ※ 해당 장소의 {GPS_VERIFY_RADIUS_M}m 이내에서만 인증할 수 있어요.
                  </p>
                </div>
              )}

              {gpsTestModal.distance === null && (
                <div className="bg-orange-100 rounded-xl p-4 border border-orange-100">
                  <p className="text-sm font-medium text-stone-600">
                    {gpsTestModal.errorMessage || '위치 정보를 수신할 수 없습니다.'}
                  </p>
                </div>
              )}

              <p className="text-sm leading-relaxed text-stone-600">
                해당 장소를 직접 방문하신 후 다시 시도해주세요.
              </p>

              <div className="flex gap-2 pt-2">
                <button
                  onClick={handleCancelVerify}
                  className="flex-1 py-2.5 rounded-xl text-sm font-bold bg-stone-100 hover:bg-stone-200 text-stone-600"
                >
                  닫기
                </button>
                <button
                  onClick={handleRetryVerify}
                  className="flex-1 py-2.5 rounded-xl text-sm font-bold bg-orange-500 text-white hover:bg-orange-600"
                >
                  다시 시도
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ===== 동의서 상세 모달 ===== */}
      {agreementModalIdx !== null && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-6">
          <div className="w-full max-w-md bg-white rounded-2xl flex flex-col" style={{ maxHeight: '80vh' }}>
            <div className="flex items-center justify-between p-5 border-b border-orange-100">
              <h3 className="text-lg font-extrabold text-stone-800">{AGREEMENTS[agreementModalIdx].title}</h3>
              <button onClick={() => setAgreementModalIdx(null)}>
                <X className="w-5 h-5 text-stone-500" />
              </button>
            </div>
            <div className="p-5 overflow-y-auto text-base whitespace-pre-line leading-relaxed text-stone-600">
              {AGREEMENTS[agreementModalIdx].subtitle && (
                <p className="font-bold text-stone-800 mb-3">{AGREEMENTS[agreementModalIdx].subtitle}</p>
              )}
              {AGREEMENTS[agreementModalIdx].content.split('~~').map((segment, i) =>
                i % 2 === 1 ? (
                  <span key={i} className="font-bold text-blue-600">{segment}</span>
                ) : (
                  <span key={i}>{segment}</span>
                )
              )}
            </div>
            <div className="p-5 pt-0">
              <button
                onClick={() => confirmAgreement(agreementModalIdx)}
                className="w-full py-3 rounded-xl text-sm font-bold bg-orange-500 text-white hover:bg-orange-600"
              >
                내용을 확인했으며 동의합니다
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<StampTourApp />);
</script>
